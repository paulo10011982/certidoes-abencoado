<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Certidões – Consulta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f2;--panel:#fff;--ink:#18212b;--ink2:#4a5664;--ink3:#7d8794;--line:#e2e5e1;--line2:#cfd4cf;--brand:#1f3a5f;--brand2:#2d5486;--brandSoft:#e8eef6;
--ok:#1f7a4d;--okSoft:#e3f2ea;--warn:#a36200;--warnSoft:#fbf0dc;--bad:#b3261e;--badSoft:#fbe5e3;--info:#5a4fb0;--infoSoft:#ecebf8;--gray:#6b7480;--graySoft:#eef0f2;
--shadow:0 1px 2px rgba(20,30,40,.06),0 4px 16px rgba(20,30,40,.05);--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:22px 18px 50px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff}
h1{font-size:20px;margin:0}.sub{color:var(--ink3);font-size:12.5px}
.btn{border:1px solid var(--line2);background:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink3)}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.sm{padding:4px 9px;font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}.kpi .n{font-size:26px;font-weight:700}.kpi .l{color:var(--ink2);font-size:12.5px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafbf9}
.filters input,.filters select{border:1px solid var(--line2);border-radius:7px;padding:6px 9px;background:#fff}.filters input{flex:1 1 220px}
table{width:100%;border-collapse:collapse}th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}tr:hover td{background:#fafbf9}
.t1{font-weight:600}.t2{color:var(--ink3);font-size:12.5px}.mono{font-family:var(--mono);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--bgc);color:var(--fc)}
.pill .d{width:7px;height:7px;border-radius:50%;background:var(--fc)}
.s-ok{--bgc:var(--okSoft);--fc:var(--ok)}.s-warn{--bgc:var(--warnSoft);--fc:var(--warn)}.s-bad{--bgc:var(--badSoft);--fc:var(--bad)}.s-info{--bgc:var(--infoSoft);--fc:var(--info)}.s-gray{--bgc:var(--graySoft);--fc:var(--gray)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--graySoft);color:var(--ink2);font-size:11.5px;font-weight:600}
.empty{padding:40px;text-align:center;color:var(--ink3)}
.tabs{display:flex;gap:4px;background:var(--graySoft);padding:3px;border-radius:8px}.tab{padding:5px 11px;border-radius:6px;border:0;background:transparent;cursor:pointer;font-weight:500;color:var(--ink2)}.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.grp{border-bottom:1px solid var(--line)}.grp>summary{padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}.grp>summary::-webkit-details-marker{display:none}.grp[open]>summary{background:#fafbf9}
.grp>summary::before{content:"▸";color:var(--ink3)}.grp[open]>summary::before{content:"▾"}
.grpsub{padding:6px 14px 6px 30px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:700;background:#fcfcfb;border-top:1px solid var(--line)}
.cell{display:inline-block;min-width:78px;padding:4px 6px;border-radius:6px;font-size:12px;font-weight:600;background:var(--bgc);color:var(--fc);cursor:pointer}.cell.none{--bgc:transparent;--fc:var(--line2);border:1px dashed var(--line2);cursor:default}
.mx td,.mx th{text-align:center;white-space:nowrap}.mx td:first-child,.mx th:first-child{text-align:left}
.lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.lock form{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px;width:min(360px,100%);text-align:center}
.lock .logo{margin:0 auto 12px}.lock input{width:100%;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin:14px 0 8px;font-size:15px}
.err{color:var(--bad);font-size:12.5px;min-height:18px}
.foot{color:var(--ink3);font-size:12px;margin-top:12px;text-align:center}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.hide-m{display:none}}
</style>
</head>
<body>
<div class="lock" id="lock"><form id="lf" autocomplete="off">
  <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h1 style="font-size:18px">Consulta de Certidões</h1><div class="sub">Digite a senha de acesso</div>
  <input type="password" id="pw" placeholder="Senha" autofocus>
  <div class="err" id="err"></div>
  <button class="btn primary" style="width:100%;justify-content:center" id="go">Entrar</button>
</form></div>

<div class="wrap" id="app" hidden>
  <header>
    <div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m9 14 2 2 4-4"/></svg></div>
      <div><h1>Consulta de Certidões e Documentos</h1><div class="sub" id="upd"></div></div></div>
    <button class="btn" id="out">Sair</button>
  </header>
  <section class="kpis" id="kpis"></section>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap">
      <div class="tabs"><button class="tab on" data-v="lista">Documentos</button><button class="tab" data-v="empresa">Por empresa</button><button class="tab" data-v="matriz">Quadro geral</button></div>
      <span class="t2" id="cnt"></span>
    </div>
    <div class="filters">
      <input type="search" id="q" placeholder="Buscar empresa, CNPJ, tipo, órgão…">
      <select id="fe"><option value="">Todas as empresas</option></select>
      <select id="fc"><option value="">Todas as categorias</option></select>
      <select id="ft"><option value="">Todos os tipos</option></select>
      <select id="fs"><option value="">Todos os status</option><option value="valida">Válidos</option><option value="avencer">Vencem em breve</option><option value="vencida">Vencidos</option><option value="semvalidade">Sem vencimento</option></select>
    </div>
    <div id="view" style="overflow:auto"></div>
  </div>
  <div class="foot">Somente consulta. Dados protegidos por criptografia.</div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const P=JSON.parse($("#payload").textContent);
let KEY=null, D=null;
async function derive(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"])}
async function dec(iv,buf){return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(iv)},KEY,buf))}
async function login(pw){KEY=await derive(pw);const pt=await dec(P.iv,b64(P.ct));D=JSON.parse(new TextDecoder().decode(pt));}
$("#lf").addEventListener("submit",async e=>{e.preventDefault();$("#err").textContent="";$("#go").textContent="Abrindo…";
  try{await login($("#pw").value);try{sessionStorage.setItem("pw",$("#pw").value)}catch(_){} show();}
  catch(_){ $("#err").textContent="Senha incorreta."; } finally{const g=$("#go");if(g)g.textContent="Entrar"}});
$("#out").onclick=()=>{try{sessionStorage.removeItem("pw")}catch(_){} location.reload()};
(async()=>{let pw=null;try{pw=sessionStorage.getItem("pw")}catch(_){} if(pw){try{await login(pw);show()}catch(_){}}})();

function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function pISO(s){if(!s)return null;const[y,m,d]=s.split("-").map(Number);return y?new Date(y,m-1,d):null}
function br(s){const d=pISO(s);return d?String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear():"—"}
function status(it){const d=pISO(it.validade);if(!d)return{k:"semvalidade",lbl:"Sem vencimento",cls:"s-gray",n:null};const n=Math.round((d-today())/864e5);
  if(n<0)return{k:"vencida",lbl:"Vencido",cls:"s-bad",n};if(n<=D.alertDias)return{k:"avencer",lbl:n===0?"Vence hoje":"Vence em breve",cls:"s-warn",n};return{k:"valida",lbl:"Válido",cls:"s-ok",n}}
function resCls(r){if(/efeitos de negativa/i.test(r))return"s-info";if(/^(positiva|consta|irregular|inapta|baixada)/i.test(r))return"s-bad";if(/negativa|nada consta|regular|ativa|v[áa]lido/i.test(r))return"s-ok";return"s-gray"}
function diasTxt(n){if(n===null)return"";if(n<0)return`há ${-n} d`;if(n===0)return"hoje";return`${n} d`}
const CAT={"Cartão CNPJ":"Cadastros e inscrições","Inscrição Estadual":"Cadastros e inscrições","Inscrição Municipal":"Cadastros e inscrições","IBGE":"Cadastros e inscrições","Alvará":"Licenças e alvarás","TTD":"Benefícios fiscais (TTD/TARE)","TARE":"Benefícios fiscais (TTD/TARE)","Benefício Fiscal":"Benefícios fiscais (TTD/TARE)","ANTT (RNTRC)":"Registros regulatórios","IBAMA (CTF/CR)":"Registros regulatórios","INMETRO":"Registros regulatórios","Ambiental":"Registros regulatórios","Conselho de Classe":"Registros regulatórios","Outra":"Outros"};
const catOf=t=>CAT[t]||"Certidões";
const CATS=["Certidões","Cadastros e inscrições","Licenças e alvarás","Benefícios fiscais (TTD/TARE)","Registros regulatórios","Outros"];
const ORDEM=["Cartão CNPJ","Federal","Estadual","Municipal","Trabalhista (CNDT)","FGTS (CRF)","Inscrição Estadual","Inscrição Municipal","Alvará","TTD","TARE"];
const dig=s=>String(s||"").replace(/\D/g,"");
function empKey(i){const d=dig(i.documento);if(d.length===11)return"PF"+d;if(d.length>=8)return"PJ"+d.slice(0,8);return"NM"+String(i.empresa||"").toUpperCase()}
let LAB={};function buildLabels(){LAB={};const g={};D.items.forEach(i=>{(g[empKey(i)]=g[empKey(i)]||[]).push(i)});
  Object.entries(g).forEach(([k,its])=>{const c=its.find(i=>i.tipo==="Cartão CNPJ"&&dig(i.documento).slice(8,12)==="0001")||its.find(i=>i.tipo==="Cartão CNPJ");
    if(c){LAB[k]=c.empresa;return}const n={};its.forEach(i=>{const x=(i.empresa||"").trim();if(x)n[x]=(n[x]||0)+1+x.length/1000});LAB[k]=Object.entries(n).sort((a,b)=>b[1]-a[1])[0]?.[0]||"(sem nome)"})}
const lab=k=>LAB[k]||k;
const fmtRaiz=k=>k.startsWith("PJ")?k.slice(2).replace(/(\d{2})(\d{3})(\d{3})/,"$1.$2.$3"):k.startsWith("PF")?k.slice(2).replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,"$1.$2.$3-$4"):"";
let VIEW="lista";
function fill(sel,vals,first){sel.innerHTML=`<option value="">${first}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join("")}
function show(){
  $("#lock").remove();$("#app").hidden=false;
  $("#upd").textContent="Atualizado em "+new Date(D.geradoEm).toLocaleString("pt-BR");
  const items=D.items;
  buildLabels();
  $("#fe").innerHTML=`<option value="">Todas as empresas</option>`+Object.keys(LAB).sort((a,b)=>lab(a).localeCompare(lab(b),"pt")).map(k=>`<option value="${esc(k)}">${esc(lab(k))}${k.startsWith("PF")?" (CPF)":""}</option>`).join("");
  fill($("#fc"),CATS.filter(c=>items.some(i=>catOf(i.tipo)===c)),"Todas as categorias");
  fill($("#ft"),[...new Set(items.map(i=>i.tipo))].sort((a,b)=>a.localeCompare(b,"pt")),"Todos os tipos");
  ["#q","#fe","#fc","#ft","#fs"].forEach(s=>$(s).addEventListener("input",render));
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));render()});
  render();
}
function render(){
  const q=$("#q").value.toLowerCase().trim(),qd=dig(q),e=$("#fe").value,c2=$("#fc").value,t=$("#ft").value,s=$("#fs").value;
  const all=D.items, c={total:all.length,valida:0,avencer:0,vencida:0,semvalidade:0};all.forEach(i=>c[status(i).k]++);
  $("#kpis").innerHTML=[["total","Documentos","var(--brand)"],["valida","Válidos","var(--ok)"],["avencer",`Vencem em ≤ ${D.alertDias} dias`,"var(--warn)"],["vencida","Vencidos","var(--bad)"],["semvalidade","Sem vencimento","var(--gray)"]]
    .map(([k,l,col])=>`<div class="kpi" style="--c:${col}"><div class="n">${c[k]}</div><div class="l">${l}</div></div>`).join("");
  const rows=all.filter(i=>(!e||empKey(i)===e)&&(!c2||catOf(i.tipo)===c2)&&(!t||i.tipo===t)&&(!s||status(i).k===s)&&(!q||[i.empresa,i.documento,i.tipo,i.orgao,i.titulo,i.numero,lab(empKey(i))].join(" ").toLowerCase().includes(q)||(qd.length>=3&&dig(i.documento).includes(qd))))
    .sort((a,b)=>(status(a).n??1e9)-(status(b).n??1e9));
  $("#cnt").textContent=`${rows.length} de ${all.length} documentos`;
  if(!rows.length){$("#view").innerHTML=`<div class="empty">Nenhum documento encontrado.</div>`;return}
  if(VIEW==="empresa"){renderEmp(rows);return} if(VIEW==="matriz"){renderMx(rows);return}
  $("#view").innerHTML=`<table><thead><tr><th>Status</th><th>Tipo / Órgão</th><th>Empresa</th><th class="hide-m">Resultado</th><th class="hide-m">Emissão</th><th>Vencimento</th><th></th></tr></thead><tbody>${
    rows.map(i=>{const st=status(i);return `<tr><td><span class="pill ${st.cls}"><span class="d"></span>${st.lbl}</span><div class="t2">${diasTxt(st.n)}</div></td>
    <td><span class="tag">${esc(i.tipo)}</span><div class="t1" style="margin-top:3px">${esc(i.orgao)}</div>${i.numero?`<div class="t2 mono">${esc(i.numero)}</div>`:""}</td>
    <td><div class="t1">${esc(lab(empKey(i)))}</div><div class="t2 mono">${esc(i.documento)}</div></td>
    <td class="hide-m"><span class="pill ${resCls(i.resultado)}">${esc(i.resultado)}</span></td>
    <td class="hide-m">${br(i.emissao)}</td><td><b>${br(i.validade)}</b></td>
    <td style="white-space:nowrap">${i.arquivo?`<button class="btn sm" data-f="${esc(i.id)}" data-m="v">Ver</button> <button class="btn sm primary" data-f="${esc(i.id)}" data-m="d">Baixar</button>`:`<span class="t2">sem PDF</span>`}</td></tr>`}).join("")}</tbody></table>`;
}
function linha(i){const st=status(i);return `<tr><td><span class="pill ${st.cls}"><span class="d"></span>${st.lbl}</span><div class="t2">${diasTxt(st.n)}</div></td>
    <td><span class="tag">${esc(i.tipo)}</span><div class="t1" style="margin-top:3px">${esc(i.orgao)}</div>${i.numero?`<div class="t2 mono">${esc(i.numero)}</div>`:""}</td>
    <td><div class="t2 mono">${esc(i.documento)}</div><div class="t2">${esc([i.municipio,i.uf].filter(Boolean).join("/"))}</div></td>
    <td><span class="pill ${resCls(i.resultado)}">${esc(i.resultado)}</span></td><td>${br(i.emissao)}</td><td><b>${br(i.validade)}</b></td>
    <td style="white-space:nowrap">${i.arquivo?`<button class="btn sm" data-f="${esc(i.id)}" data-m="v">Ver</button> <button class="btn sm primary" data-f="${esc(i.id)}" data-m="d">Baixar</button>`:`<span class="t2">sem PDF</span>`}</td></tr>`}
function renderEmp(rows){
  const g={};rows.forEach(i=>(g[empKey(i)]=g[empKey(i)]||[]).push(i));
  const ks=Object.keys(g).sort((a,b)=>lab(a).localeCompare(lab(b),"pt"));
  $("#view").innerHTML=ks.map(k=>{const its=g[k],c={valida:0,avencer:0,vencida:0,semvalidade:0};its.forEach(i=>c[status(i).k]++);
    const porCat={};its.forEach(i=>(porCat[catOf(i.tipo)]=porCat[catOf(i.tipo)]||[]).push(i));
    return `<details class="grp" ${ks.length<=2||$("#fe").value?"open":""}><summary><span class="t1">${esc(lab(k))}</span><span class="t2 mono">${esc(fmtRaiz(k))}${k.startsWith("PJ")?" (raiz)":" (CPF)"}</span><span style="flex:1"></span>
      <span class="pill s-ok">${c.valida} válidos</span>${c.avencer?`<span class="pill s-warn">${c.avencer} vencem em breve</span>`:""}${c.vencida?`<span class="pill s-bad">${c.vencida} vencidos</span>`:""}<span class="pill s-gray">${c.semvalidade} sem venc.</span></summary>
      ${CATS.filter(x=>porCat[x]).map(x=>`<div class="grpsub">${esc(x)}</div><table><tbody>${porCat[x].sort((a,b)=>(ORDEM.indexOf(a.tipo)+99)%99-(ORDEM.indexOf(b.tipo)+99)%99||dig(a.documento).localeCompare(dig(b.documento))).map(linha).join("")}</tbody></table>`).join("")}</details>`}).join("");
}
function renderMx(rows){
  const g={};rows.forEach(i=>(g[empKey(i)]=g[empKey(i)]||[]).push(i));
  const ks=Object.keys(g).sort((a,b)=>lab(a).localeCompare(lab(b),"pt"));
  const tipos=[...ORDEM.filter(t=>rows.some(i=>i.tipo===t)),...[...new Set(rows.map(i=>i.tipo))].filter(t=>!ORDEM.includes(t))];
  $("#view").innerHTML=`<div style="overflow:auto"><table class="mx"><thead><tr><th>Empresa</th>${tipos.map(t=>`<th>${esc(t)}</th>`).join("")}</tr></thead><tbody>${ks.map(k=>`<tr><td><div class="t1">${esc(lab(k))}</div><div class="t2 mono">${esc(fmtRaiz(k))}</div></td>${tipos.map(t=>{const l=g[k].filter(i=>i.tipo===t);if(!l.length)return`<td><span class="cell none">—</span></td>`;
    const i=l.sort((a,b)=>(a.validade||"9999").localeCompare(b.validade||"9999"))[0],st=status(i),cls=/^(positiva|consta|irregular|inapta|baixada)/i.test(i.resultado)&&!/efeitos/i.test(i.resultado)?"s-bad":st.k==="semvalidade"?"s-info":st.cls;
    return`<td><span class="cell ${cls}" title="${esc(i.resultado)}">${i.validade?br(i.validade):"Sem venc."}${l.length>1?` (${l.length})`:""}</span></td>`}).join("")}</tr>`).join("")}</tbody></table></div>
  <div class="t2" style="padding:10px 14px">Cada célula mostra o vencimento mais próximo daquele tipo (entre parênteses, quantos estabelecimentos têm o documento). Verde: válido · Amarelo: vence em breve · Vermelho: vencido · Azul: sem vencimento.</div>`;
}
$("#view").addEventListener("click",async e=>{const b=e.target.closest("[data-f]");if(!b)return;const i=D.items.find(x=>x.id===b.dataset.f);if(!i)return;
  const w=b.dataset.m==="v"?window.open("","_blank"):null; const old=b.textContent;b.textContent="…";
  try{const r=await fetch(i.arquivo.path,{cache:"no-store"});if(!r.ok)throw 0;const pt=await dec(i.arquivo.iv,await r.arrayBuffer());
    const url=URL.createObjectURL(new Blob([pt],{type:i.arquivo.tipo||"application/pdf"}));
    if(w){w.location=url}else{const a=document.createElement("a");a.href=url;a.download=i.arquivo.nome;document.body.appendChild(a);a.click();a.remove()}
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(_){if(w)w.close();alert("Não foi possível abrir o arquivo.")}finally{b.textContent=old}});
</script>
